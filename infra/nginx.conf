events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Each running sandbox with an exposed port gets a generated file here
  # (see backend/src/utils/proxyManager.js) mapping <name>.<BASE_DOMAIN> -> 127.0.0.1:<hostPort>.
  include /etc/nginx/conf.d/sandboxes/*.conf;

  server {
    listen 80 default_server;
    server_name _;
    return 404;
  }
}
